<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 1000"
  role="img"
  aria-labelledby="logo-title logo-description"
>
  <title id="logo-title">Math With Yousra geometric emblem</title>
  <desc id="logo-description">
    A circular, eightfold-symmetric geometric emblem inspired by
    hyperbolic geodesics in the Poincare disk.
  </desc>

  <defs>
    <!-- Keep all interior geometry inside the disk. -->
    <clipPath id="disk-clip">
      <circle cx="500" cy="500" r="450" />
    </clipPath>

    <!-- One large curved sector, repeated eight times. -->
    <g id="major-sector">
      <!-- Arc joining adjacent principal vertices. -->
      <path d="M500 50
               C500 215 610 275 818.2 181.8" />

      <!-- Curved ray flowing toward the center. -->
      <path d="M818.2 181.8
               C690 285 620 378 500 500" />

      <!-- Narrow interior sweep that forms the central compass point. -->
      <path d="M818.2 181.8
               C670 330 595 432 500 500" />
    </g>

    <!-- One boundary scallop, repeated around the circumference. -->
    <g id="boundary-scallop">
      <path d="M500 50
               C484 71 484 95 500 114
               C516 95 516 71 500 50" />

      <path d="M500 50
               C492 64 492 78 500 89
               C508 78 508 64 500 50" />
    </g>

    <!-- One point of the central eight-point star. -->
    <g id="star-point">
      <path d="M500 500
               L500 294
               L526 442
               Z" />

      <path d="M500 500
               L500 350
               L518 462
               Z" />
    </g>
  </defs>

  <!-- Transparent background. Change none to #fbfaf7 for ivory. -->
  <rect width="1000" height="1000" fill="none" />

  <g
    fill="none"
    stroke="#111111"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Outer boundary -->
    <circle cx="500" cy="500" r="450" stroke-width="10" />

    <g clip-path="url(#disk-clip)">
      <!-- Principal horizontal and vertical axes -->
      <path d="M50 500 H950" />
      <path d="M500 50 V950" />

      <!-- Large symmetric curved framework -->
      <use href="#major-sector" />
      <use href="#major-sector" transform="rotate(45 500 500)" />
      <use href="#major-sector" transform="rotate(90 500 500)" />
      <use href="#major-sector" transform="rotate(135 500 500)" />
      <use href="#major-sector" transform="rotate(180 500 500)" />
      <use href="#major-sector" transform="rotate(225 500 500)" />
      <use href="#major-sector" transform="rotate(270 500 500)" />
      <use href="#major-sector" transform="rotate(315 500 500)" />

      <!-- Additional large geodesic-like arcs -->
      <path d="M181.8 181.8
               C355 315 645 315 818.2 181.8" />

      <path d="M818.2 181.8
               C685 355 685 645 818.2 818.2" />

      <path d="M818.2 818.2
               C645 685 355 685 181.8 818.2" />

      <path d="M181.8 818.2
               C315 645 315 355 181.8 181.8" />

      <!-- Diagonal structural lines -->
      <path d="M181.8 181.8 L500 500 L818.2 818.2" />
      <path d="M818.2 181.8 L500 500 L181.8 818.2" />

      <!-- Eight-point central compass star -->
      <g stroke-width="4">
        <use href="#star-point" />
        <use href="#star-point" transform="rotate(45 500 500)" />
        <use href="#star-point" transform="rotate(90 500 500)" />
        <use href="#star-point" transform="rotate(135 500 500)" />
        <use href="#star-point" transform="rotate(180 500 500)" />
        <use href="#star-point" transform="rotate(225 500 500)" />
        <use href="#star-point" transform="rotate(270 500 500)" />
        <use href="#star-point" transform="rotate(315 500 500)" />

        <!-- Small inner polygonal web -->
        <path d="M500 410
                 L564 436
                 L590 500
                 L564 564
                 L500 590
                 L436 564
                 L410 500
                 L436 436
                 Z" />

        <path d="M500 442
                 L541 459
                 L558 500
                 L541 541
                 L500 558
                 L459 541
                 L442 500
                 L459 459
                 Z" />

        <path d="M500 410 L541 541 L410 500 L541 459
                 L500 590 L459 459 L590 500 L459 541 Z" />
      </g>

      <!-- Repeating scalloped boundary -->
      <g stroke-width="3">
        <use href="#boundary-scallop" />
        <use href="#boundary-scallop" transform="rotate(15 500 500)" />
        <use href="#boundary-scallop" transform="rotate(30 500 500)" />
        <use href="#boundary-scallop" transform="rotate(45 500 500)" />
        <use href="#boundary-scallop" transform="rotate(60 500 500)" />
        <use href="#boundary-scallop" transform="rotate(75 500 500)" />
        <use href="#boundary-scallop" transform="rotate(90 500 500)" />
        <use href="#boundary-scallop" transform="rotate(105 500 500)" />
        <use href="#boundary-scallop" transform="rotate(120 500 500)" />
        <use href="#boundary-scallop" transform="rotate(135 500 500)" />
        <use href="#boundary-scallop" transform="rotate(150 500 500)" />
        <use href="#boundary-scallop" transform="rotate(165 500 500)" />
        <use href="#boundary-scallop" transform="rotate(180 500 500)" />
        <use href="#boundary-scallop" transform="rotate(195 500 500)" />
        <use href="#boundary-scallop" transform="rotate(210 500 500)" />
        <use href="#boundary-scallop" transform="rotate(225 500 500)" />
        <use href="#boundary-scallop" transform="rotate(240 500 500)" />
        <use href="#boundary-scallop" transform="rotate(255 500 500)" />
        <use href="#boundary-scallop" transform="rotate(270 500 500)" />
        <use href="#boundary-scallop" transform="rotate(285 500 500)" />
        <use href="#boundary-scallop" transform="rotate(300 500 500)" />
        <use href="#boundary-scallop" transform="rotate(315 500 500)" />
        <use href="#boundary-scallop" transform="rotate(330 500 500)" />
        <use href="#boundary-scallop" transform="rotate(345 500 500)" />
      </g>
    </g>

    <!-- Redraw boundary so it remains perfectly clean -->
    <circle cx="500" cy="500" r="450" stroke-width="10" />
  </g>
</svg>
